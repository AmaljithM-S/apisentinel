services:
  db:
    restart: unless-stopped
  backend:
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    depends_on:
      db:
        condition: service_healthy
  frontend:
    restart: unless-stopped
  vulnapi:
    restart: unless-stopped
  zap:
    restart: unless-stopped

networks:
  default:
    ipam:
      config:
        - subnet: 172.18.0.0/16
          gateway: 172.18.0.1
