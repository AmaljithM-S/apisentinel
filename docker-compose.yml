services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-apisentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-apisentinel}
      POSTGRES_DB: ${POSTGRES_DB:-apisentinel}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-apisentinel} -d ${POSTGRES_DB:-apisentinel}"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "${POSTGRES_PORT:-5433}:5432"

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-apisentinel}:${POSTGRES_PASSWORD:-apisentinel}@db:5432/${POSTGRES_DB:-apisentinel}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5-coder:7b}
      HOSTED_LLM_BASE_URL: ${HOSTED_LLM_BASE_URL:-}
      HOSTED_LLM_API_KEY: ${HOSTED_LLM_API_KEY:-}
      HOSTED_LLM_MODEL: ${HOSTED_LLM_MODEL:-}
      ZAP_BASE_URL: ${ZAP_BASE_URL:-http://zap:8080}
      ZAP_API_KEY: ${ZAP_API_KEY:-apisentinel-zap}
      RUNTIME_TARGET_ALLOWLIST: ${RUNTIME_TARGET_ALLOWLIST:-http://vulnapi:8001,http://localhost,http://127.0.0.1}
      ALLOW_PUBLIC_TARGETS: ${ALLOW_PUBLIC_TARGETS:-false}
      WEB_MAX_PAGES: ${WEB_MAX_PAGES:-60}
      WEB_MAX_CRAWL_DEPTH: ${WEB_MAX_CRAWL_DEPTH:-6}
      WEB_REQUEST_TIMEOUT_SECONDS: ${WEB_REQUEST_TIMEOUT_SECONDS:-10}
      WEB_REQUEST_DELAY_MS: ${WEB_REQUEST_DELAY_MS:-150}
      WEB_USER_AGENT: ${WEB_USER_AGENT:-APISentinel-WebScanner/1.0 (+authorized-security-assessment)}
      ZAP_ENABLE_ACTIVE_SCAN: ${ZAP_ENABLE_ACTIVE_SCAN:-false}
      SEED_GROUND_TRUTH: "true"
      SEED_DEMO_USER: "true"
      DEMO_USER_EMAIL: ${DEMO_USER_EMAIL:-analyst@apisentinel.local}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-apisentinel123}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./datasets:/datasets:ro
      - ./targets:/targets:ro
      - ./evaluation:/evaluation
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/api/health')\""]
      interval: 10s
      timeout: 5s
      retries: 20

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:80"

  vulnapi:
    build:
      context: ./targets/vulnapi
    environment:
      DEBUG: "true"
    ports:
      - "${VULNAPI_PORT:-8001}:8001"

  zap:
    image: ghcr.io/zaproxy/zaproxy:stable
    command: >
      zap.sh -daemon -host 0.0.0.0 -port 8080
      -config api.addrs.addr.name=.*
      -config api.addrs.addr.regex=true
      -config api.key=${ZAP_API_KEY:-apisentinel-zap}
    ports:
      - "${ZAP_PORT:-8090}:8080"

volumes:
  db_data:
